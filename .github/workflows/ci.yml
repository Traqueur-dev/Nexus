name: ci

on:
  push:
    # Feature branches get feedback on push, not only once a pull request exists.
    branches: [ main, develop, 'feature/**', 'refactor/**', 'fix/**', 'chore/**' ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build

      - name: Publish test report
        # Runs on failure too — a red build is when the report is most useful.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/test'
          retention-days: 7
          if-no-files-found: ignore
