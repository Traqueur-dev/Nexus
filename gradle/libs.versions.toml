[versions]
java = "25"
springBoot = "4.1.1"
springDependencyManagement = "1.1.7"
# Aligned on what the Spring Boot BOM imposes, so modules without the BOM
# (nexus-domain, nexus-application) cannot drift from the ones that have it.
junit = "6.0.3"
assertj = "3.27.7"
# Testcontainers 2.x renamed every module with a testcontainers- prefix
# (org.testcontainers:postgresql -> org.testcontainers:testcontainers-postgresql).
# Version pinned because the nested BOM is not propagated by dependency-management.
testcontainers = "2.0.5"
archunit = "1.4.1"

[libraries]
# Plugin artifacts, needed on build-logic's classpath so the convention plugins
# can apply them. Declared as libraries, not plugins: a precompiled script plugin
# resolves them as ordinary dependencies.
plugin-spring-boot = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "springBoot" }
plugin-spring-dependency-management = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "springDependencyManagement" }

# Versions omitted throughout: the Spring Boot BOM manages them, which is the
# point of applying io.spring.dependency-management.
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa" }
spring-boot-starter-flyway = { module = "org.springframework.boot:spring-boot-starter-flyway" }
spring-boot-starter-amqp = { module = "org.springframework.boot:spring-boot-starter-amqp" }
spring-boot-starter-mail = { module = "org.springframework.boot:spring-boot-starter-mail" }

# Jackson 3 — the one Spring Boot 4 wires into its message converters. The BOM
# manages both major versions (jackson-bom 3.x and jackson-2-bom 2.x); using the
# 2.x line here would mean the application's ObjectMapper and the one serializing
# HTTP responses are different objects with different configuration.
jackson-databind = { module = "tools.jackson.core:jackson-databind" }

# jackson-databind plus Boot's Jackson auto-configuration. Needed wherever a
# module contributes to how the application encodes JSON, because the extension
# point (JsonMapperBuilderCustomizer) ships with the auto-configuration and not
# with Jackson itself.
spring-boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }

flyway-database-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }
postgresql = { module = "org.postgresql:postgresql" }

# Test essentials, applied by nexus.java-conventions. Versions are explicit
# rather than BOM-managed so nexus-domain needs no Spring plugin at all.
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }

spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-starter-webmvc-test = { module = "org.springframework.boot:spring-boot-starter-webmvc-test" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:testcontainers-junit-jupiter", version.ref = "testcontainers" }
testcontainers-postgresql = { module = "org.testcontainers:testcontainers-postgresql", version.ref = "testcontainers" }
testcontainers-rabbitmq = { module = "org.testcontainers:testcontainers-rabbitmq", version.ref = "testcontainers" }
awaitility = { module = "org.awaitility:awaitility" }
# The core library, not archunit-junit5: the JUnit integration brings its own
# Jupiter extension, and this build is on JUnit 6. Rules are checked from plain
# @Test methods instead, which costs one line per rule and no version coupling.
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
